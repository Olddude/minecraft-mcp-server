version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    entrypoint: ["node"]
    command: ["index.js"]
    environment:
      - NODE_ENV='development'
      - MINECRAFT_HOST='localhost'
      - MINECRAFT_PORT='25565'
      - MCRCON_HOST='localhost'
      - MCRCON_PORT='25575'
      - MCRCON_PASS='minecraft'

  client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    entrypoint: ["node"]
    command: ["index.js"]
    environment:
      - NODE_ENV='development'
      - MINECRAFT_HOST='localhost'
      - MINECRAFT_PORT='25565'
      - MCRCON_HOST='localhost'
      - MCRCON_PORT='25575'
      - MCRCON_PASS='minecraft'
